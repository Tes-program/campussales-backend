name: Keep warm

# Pings the API and the frontend so hosts that sleep idle services never make
# a student wait for a cold start. Set repository variables API_URL (e.g.
# https://api.example.com) and FRONTEND_URL. GitHub may delay scheduled runs;
# the real fix is a plan/service type that does not sleep (docs/infra.md §4).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        env:
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          set -u
          [ -n "${API_URL:-}" ] && curl -fsS -m 60 -o /dev/null -w "api %{http_code} %{time_total}s\n" "$API_URL/health" || echo "API_URL not set or ping failed"
          [ -n "${FRONTEND_URL:-}" ] && curl -fsS -m 60 -o /dev/null -w "frontend %{http_code} %{time_total}s\n" "$FRONTEND_URL" || echo "FRONTEND_URL not set or ping failed"
